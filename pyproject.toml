[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depression-detection-ml"
version = "0.1.0"
description = "Course project: English mental-health text depression screening (TF-IDF + classical ML + Tkinter GUI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.8.0",
  "joblib>=1.3.0",
  "imbalanced-learn>=0.11.0",
  "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
train = ["matplotlib>=3.7.0", "seaborn>=0.13.0", "xgboost>=2.0.0"]
embeddings = ["sentence-transformers>=3.0.0"]
notebook = ["jupyter>=1.0.0", "ipykernel>=6.25.0"]
full = [
  "matplotlib>=3.7.0",
  "seaborn>=0.13.0",
  "xgboost>=2.0.0",
  "sentence-transformers>=3.0.0",
  "jupyter>=1.0.0",
  "ipykernel>=6.25.0",
]
dev = ["pytest>=7.4.0", "matplotlib>=3.7.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
